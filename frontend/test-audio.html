<!DOCTYPE html>
<html>

<head>
    <title>Test Audio API</title>
</head>

<body>
    <h1>Test de l'API Audio</h1>
    <button id="recordBtn">Démarrer l'enregistrement</button>
    <button id="testBtn">Tester l'API</button>
    <div id="status"></div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        const recordBtn = document.getElementById('recordBtn');
        const testBtn = document.getElementById('testBtn');
        const status = document.getElementById('status');

        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });

                        const formData = new FormData();
                        formData.append('audio', audioBlob, 'test.webm');

                        try {
                            const response = await fetch('/api/chat', {
                                method: 'POST',
                                body: formData
                            });

                            if (response.ok) {
                                const contentType = response.headers.get('content-type');
                                if (contentType && contentType.includes('audio/')) {
                                    const audioBuffer = await response.arrayBuffer();
                                    const audioBlob = new Blob([audioBuffer], { type: contentType });
                                    const audioUrl = URL.createObjectURL(audioBlob);

                                    const audio = new Audio(audioUrl);
                                    audio.play();
                                    status.textContent = 'Réponse audio reçue et jouée !';
                                } else {
                                    const data = await response.json();
                                    status.textContent = 'Réponse texte: ' + data.result;
                                }
                            } else {
                                status.textContent = 'Erreur: ' + response.status;
                            }
                        } catch (error) {
                            status.textContent = 'Erreur: ' + error.message;
                        }
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.textContent = 'Arrêter l\'enregistrement';
                    status.textContent = 'Enregistrement en cours...';
                } catch (error) {
                    status.textContent = 'Erreur microphone: ' + error.message;
                }
            } else {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                isRecording = false;
                recordBtn.textContent = 'Démarrer l\'enregistrement';
                status.textContent = 'Envoi en cours...';
            }
        });

        testBtn.addEventListener('click', async () => {
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: [{
                            role: 'user',
                            content: 'Bonjour, test de l\'API'
                        }]
                    })
                });

                const data = await response.json();
                status.textContent = 'Test API réussi: ' + data.result;
            } catch (error) {
                status.textContent = 'Erreur test API: ' + error.message;
            }
        });
    </script>
</body>

</html>
